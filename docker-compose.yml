# Local development environment for CampaignClipper.
# Brings up PostgreSQL, Redis, and (optionally) MinIO as an R2-compatible
# object store. The Next.js app + workers run on the host via `npm run dev`
# and `npm run worker:*`, or can be containerized with the `app` profile.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: clipper
      POSTGRES_DB: campaignclipper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper -d campaignclipper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # R2-compatible object storage for local dev.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: clipper
      MINIO_ROOT_PASSWORD: clipperclipper
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional containerized app + worker (enable with `--profile app`).
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clipper:clipper@postgres:5432/campaignclipper?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
